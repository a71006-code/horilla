services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - 18001:8000    
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgres://postgres:postgres@db:5432/horilla"
      CSRF_TRUSTED_ORIGINS: "http://*,https://*"
    command: sh ./entrypoint.sh
    user: "1026:100"
    volumes:
      #- /volume1/docker/horilla:/app
      - /volume1/docker/horilla/media:/app/media
      - /volume1/docker/horilla/report/static/report/forms:/app/report/static/report/forms
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-bullseye
    environment:
      POSTGRES_DB: horilla
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - 15432:5432
    restart: unless-stopped
    volumes:
      - horilla-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  horilla-data:
